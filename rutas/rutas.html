<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excursiones de Día | Nuestras Rutas</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="rutas.css">
    <meta name="description" content="Explora las mejores rutas de senderismo y excursiones de un día desde Bilbao y Bizkaia. Pagasarri, Flysch de Barrika, Bosque de Oma, Amboto y Salto del Nervión.">
    <link rel="icon" href="../img/logo_bizkaibide.svg" type="image/svg+xml">
</head>

<body>

    <header>
        <div class="header-left">
            <div class="logo_bizkaibide"><a href="../index.html"><img src="../img/logo_bizkaibide.svg" alt="Bizkaibide" /></a></div>
            <div id="fechaDia"></div>
        </div>
        <nav>
            <ul>
                <li><a href="../conocenos/conocenos.html">Conocenos</a></li>
                <li><a href="../rutas/rutas.html" class="active">Rutas</a></li>
                <li><a href="../icontacto/icontacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <a href="../ilogin/ilogin.html" class="btn-login" id="btnLogin">Login</a>
            <a href="../registro/registro.html" class="btn-registro" id="btnRegistro">Registro</a>
        </div>
    </header>

    <main>
        <section id="rutas-section" class="rutas-section">
            <div class="rutas-header">
                <h1>RUTAS DE SENDERISMO</h1>
                <p class="inicio-bienvenida">Descubre los senderos más emblemáticos de Bilbao y sus alrededores. Rutas seleccionadas detalladamente para todos los niveles.</p>
            </div>
            
            <!-- Panel de Filtros Interactivo -->
            <div class="filters-panel">
                <div class="filter-group search-group">
                    <input type="text" id="search-routes" placeholder="Buscar por nombre o palabras clave...">
                    <span class="search-icon">🔍</span>
                </div>
                
                <div class="filter-group chips-group">
                    <button class="filter-chip active" data-dificultad="todos">Todos</button>
                    <button class="filter-chip" data-dificultad="facil">Fácil</button>
                    <button class="filter-chip" data-dificultad="facil-moderada">Fácil / Med.</button>
                    <button class="filter-chip" data-dificultad="moderada">Moderada</button>
                    <button class="filter-chip" data-dificultad="alta">Alta</button>
                </div>
                
                <div class="filter-group sort-group">
                    <label for="sort-routes">Ordenar por:</label>
                    <div class="select-container">
                        <select id="sort-routes">
                            <option value="relevancia">Relevancia</option>
                            <option value="distancia">Distancia (Menor a Mayor)</option>
                            <option value="tiempo">Tiempo (Menor a Mayor)</option>
                            <option value="desnivel">Desnivel (Menor a Mayor)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="results-bar">
                <span id="results-count">Cargando rutas...</span>
            </div>
            
            <div class="rutas-grid" id="rutasGrid"></div>
        </section>     
    </main>

    <footer class="inicio-footer">
        <div class="caja-footer">
            <p class="p-footer">&copy; 2026 Proyecto Personal. Todos los derechos reservados.</p>
            <a href="../icontacto/icontacto.html">Contacto</a>
        </div>
    </footer>
    
    <script src="../js/fechadia.js"></script>
    <script src="../js/rutas.js"></script>

</body>
</html>
