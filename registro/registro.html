<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excursiones de Día | Registro</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="registro.css">
    <meta name="description" content="Crea tu cuenta en Excursiones de Día para guardar tus excursiones favoritas y recibir nuestras sugerencias semanales.">
    <link rel="icon" href="../img/logo_bizkaibide.svg" type="image/svg+xml">
</head>

<body>

    <header>
        <div class="header-left">
            <div class="logo_bizkaibide"><a href="../index.html"><img src="../img/logo_bizkaibide.svg" alt="Bizkaibide" /></a></div>
            <div id="fechaDia"></div>
        </div>
        <nav>
            <ul>
                <li><a href="../conocenos/conocenos.html">Conocenos</a></li>
                <li><a href="../rutas/rutas.html">Rutas</a></li>
                <li><a href="../icontacto/icontacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <a href="../ilogin/ilogin.html" class="btn-login" id="btnLogin">Login</a>
            <a href="../registro/registro.html" class="btn-registro" id="btnRegistro">Registro</a>
        </div>
    </header>

    <main>
        <section id="inicio" class="inicio">
            <div class="inicio-inicio">
                <h1>CREAR CUENTA</h1>
                <p class="inicio-bienvenida">Únete a nuestra comunidad de amantes del senderismo y empieza a disfrutar de la naturaleza de Bizkaia.</p>
                
                <div>
                    <form class="form-container" id="formRegistro">
                        <h2 class="form-title">Registro</h2>
                        
                        <div class="form-group">
                            <label for="nombre">Nombre Completo:</label>
                            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre y apellidos" />
                        </div>

                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com" />
                        </div>
                        
                        <div class="form-group">
                            <label for="password">Contraseña:</label>
                            <input type="password" id="password" name="password" required placeholder="Crea una contraseña" />
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">Confirmar Contraseña:</label>
                            <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repite la contraseña" />
                        </div>
                        
                        <div class="form-checkbox">
                            <input type="checkbox" id="acepto" name="acepto" required>
                            <label for="acepto">Acepto las condiciones generales y políticas de privacidad de la web.</label>
                        </div>

                        <button type="submit" class="btn-submit" id="btnRegistrarse">Registrarse</button>
                        
                        <div class="form-footer-text">
                            ¿Ya tienes una cuenta? <a href="../ilogin/ilogin.html">Inicia sesión aquí</a>
                        </div>
                    </form>
                </div>

                <div class="inicio_img" style="margin-top: 3rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; width: 100%;">
                    <img src="../img/imagen4.jpeg" alt="Montañero descansando" style="max-width: 450px; width: 100%; border-radius: var(--border-radius); box-shadow: var(--card-shadow); transition: var(--transition);">
                    <img src="../img/imagen3.jpeg" alt="Camino de montaña" style="max-width: 450px; width: 100%; border-radius: var(--border-radius); box-shadow: var(--card-shadow); transition: var(--transition);">
                </div>
            </div>
        </section>     
    </main>

    <footer class="inicio-footer">
        <div class="caja-footer">
            <p class="p-footer">&copy; 2026 Proyecto Personal. Todos los derechos reservados.</p>
            <a href="../icontacto/icontacto.html">Contacto</a>
        </div>
    </footer>
    
    <script src="../js/fechadia.js"></script>
    <script src="../js/registro.js"></script>

</body>
</html>
