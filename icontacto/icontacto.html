<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excursiones de Día | Contacto</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="icontacto.css">
    <meta name="description" content="Ponte en contacto con nosotros para cualquier duda, sugerencia o reserva de nuestras excursiones de día.">
    <link rel="icon" href="../img/logo_bizkaibide.svg" type="image/svg+xml">
</head>

<body>

    <header>
        <div class="header-left">
            <div class="logo_salud"><a href="../index.html"><img src="../img/logo_bizkaibide.svg" alt="Bizkaibide" /></a></div>
            <div id="fechaDia"></div>
        </div>
        <nav>
            <ul>
                <li><a href="../conocenos/conocenos.html">Conocenos</a></li>
                <li><a href="../rutas/rutas.html">Rutas</a></li>
                <li><a href="../icontacto/icontacto.html">Contacto</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <a href="../ilogin/ilogin.html" class="btn-login" id="btnLogin">Login</a>
            <a href="../registro/registro.html" class="btn-registro" id="btnRegistro">Registro</a>
        </div>
    </header>

    <main>
        <section id="inicio" class="inicio">
            <div class="inicio-inicio">
                <h1>CONTACTO</h1>
                <p class="inicio-bienvenida">¿Tienes alguna pregunta o propuesta de excursión? ¡Escríbenos y nos pondremos en contacto contigo!</p>
                
                <div>
                    <form class="form-container form-contacto" action="../ilogin/informacion.html" method="GET">
                        <h2 class="form-title">Escríbenos</h2>
                        
                        <div class="form-group">
                            <label for="nombre">Nombre:</label>
                            <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre" />
                        </div>
                        
                        <div class="form-group">
                            <label for="apellidos">Apellidos:</label>
                            <input type="text" id="apellidos" name="apellidos" required placeholder="Tus apellidos" />
                        </div>
                        
                        <div class="form-group">
                            <label for="telefono">Teléfono:</label>
                            <input type="tel" id="telefono" name="telefono" required placeholder="Tu teléfono de contacto" />
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com" />
                        </div>
                        
                        <div class="form-group">
                            <label for="comentario">Mensaje:</label>
                            <textarea id="comentario" name="comentario" rows="5" placeholder="¿En qué podemos ayudarte? Cuéntanos..." required></textarea>
                        </div>
                        
                        <div class="form-checkbox">
                            <input type="checkbox" id="acepto" name="acepto" required>
                            <label for="acepto">Al enviar el formulario acepto la política de privacidad y condiciones generales de la web.</label>
                        </div>

                        <button type="submit" class="btn-submit" id="btnEnviar">Enviar Mensaje</button>
                    </form>
                </div>

                <div class="inicio_img" style="margin-top: 3rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; width: 100%;">
                    <img src="../img/imagen2.jpeg" alt="Excursión de montaña" style="max-width: 450px; width: 100%; border-radius: var(--border-radius); box-shadow: var(--card-shadow); transition: var(--transition);">
                    <img src="../img/imagen3.jpeg" alt="Sendero boscoso" style="max-width: 450px; width: 100%; border-radius: var(--border-radius); box-shadow: var(--card-shadow); transition: var(--transition);">
                </div>
            </div>
        </section>     
    </main>

    <footer class="inicio-footer">
        <div class="caja-footer">
            <p class="p-footer">&copy; 2026 Proyecto Personal. Todos los derechos reservados.</p>
            <a href="../icontacto/icontacto.html">Contacto</a>
        </div>
    </footer>
    
    <script src="../js/fechadia.js"></script>
    <script src="../js/contacto.js"></script>

</body>
</html>
